<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang In Kiểm Tra Sản Phẩm TWON & D'VAH</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; padding: 20px; color: #1e293b; }
        h1 { color: #be185d; text-align: center; margin-bottom: 8px; }
        p.subtitle { text-align: center; color: #64748b; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .card-img { width: 100%; height: 220px; background: #f1f5f9; border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 12px; }
        .card-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .badge { display: inline-block; background: #fce7f3; color: #be185d; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; margin-bottom: 6px; }
        .title { font-size: 16px; font-weight: bold; margin: 4px 0 8px 0; color: #0f172a; }
        .price { font-size: 18px; font-weight: 800; color: #e11d48; }
        .url { font-size: 11px; color: #0284c7; word-break: break-all; margin: 8px 0; font-family: monospace; background: #f0f9ff; padding: 6px; border-radius: 6px; }
        .inci { font-size: 11px; color: #475569; background: #f8fafc; padding: 8px; border-radius: 6px; line-height: 1.4; border-left: 3px solid #be185d; margin-top: 8px; }
    </style>
</head>
<body>
    <h1>BẢNG IN KIỂM TRA TOÀN BỘ SẢN PHẨM TWON & D'VAH</h1>
    <p class="subtitle">Trang in đối soát đường dẫn hình ảnh và bảng thành phần trước khi phát hành</p>
    
    <div class="grid" id="product-grid"></div>

    <script src="js/skin-ai.js"></script>
    <script>
        const grid = document.getElementById('product-grid');
        const targetBrands = ['TWON', 'DVAH', 'D\'VAH'];
        const filtered = PRODUCTS.filter(p => targetBrands.includes(p.brand) || targetBrands.includes(p.brandSlug));

        filtered.forEach(p => {
            const imgSrc = (p.image.startsWith('http') || p.image.startsWith('data:')) ? p.image : `public${p.image}`;
            grid.innerHTML += `
                <div class="card">
                    <div class="card-img">
                        <img src="${imgSrc}" alt="${p.name}" onerror="this.onerror=null; this.src='${p.originalImageUrl}';">
                    </div>
                    <span class="badge">${p.brand} • ${p.volume}</span>
                    <div class="title">${p.name}</div>
                    <div class="price">${p.price.toLocaleString('vi-VN')} ₫</div>
                    <div class="url"><strong>URL Ảnh Render:</strong><br>${imgSrc}</div>
                    <div class="inci"><strong>Thành phần INCI:</strong><br>${p.fullIngredients}</div>
                </div>
            `;
        });
    </script>
</body>
</html>
